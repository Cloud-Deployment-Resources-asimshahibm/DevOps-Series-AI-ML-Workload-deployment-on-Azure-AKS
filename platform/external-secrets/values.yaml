installCRDs: true
replicaCount: 2
serviceAccount:
  name: external-secrets
# Microsoft Entra Workload ID: the webhook injects a federated token for the
# identity named in the SA annotation (client-id) into pods with this label.
podLabels:
  azure.workload.identity/use: "true"
nodeSelector:
  workload: system
serviceMonitor:
  enabled: false   # Prometheus CRDs arrive in a later wave; scraped via observability-extras
webhook:
  replicaCount: 2
  nodeSelector:
    workload: system
certController:
  nodeSelector:
    workload: system
